<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Operativo - CRYO</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(30, 41, 59, 0.8);
            padding: 15px 30px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-logout {
            background-color: #e11d48;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn-logout:hover { background-color: #be123c; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 14px;
        }
        th, td {
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            text-align: center;
        }
        th { background: rgba(2, 132, 199, 0.2); color: #38bdf8; text-transform: uppercase; }
        .op-name { text-align: left; font-weight: bold; color: #e2e8f0; }
        /* Estilos de celda para estatus de descanso */
        .estatus-de { background-color: rgba(71, 85, 105, 0.5); color: #94a3b8; }
    </style>
</head>
<body>

    <div class="header-bar">
        <div>
            <h2 style="margin: 0; color: #38bdf8;">Logística FNG</h2>
            <span style="font-size: 14px; color: #94a3b8;">Línea de Negocio: CRIOGÉNICOS</span>
        </div>
        <div>
            <span style="margin-right: 20px;">👤 Sesión: <b>{{ usuario }}</b></span>
            <a href="{{ url_for('logout') }}" class="btn-logout">Cerrar Sesión</a>
        </div>
    </div>

    <div class="glass-panel">
        <h3 style="margin-top: 0;">Disponibilidad Diaria</h3>
        <table>
            <thead>
                <tr>
                    <th style="text-align: left;">Operador</th>
                    <th>Lunes</th>
                    <th>Martes</th>
                    <th>Miércoles</th>
                    <th>Jueves</th>
                    <th>Viernes</th>
                    <th>Sábado</th>
                    <th>Domingo</th>
                </tr>
            </thead>
            <tbody>
                {% for op in operadores %}
                <tr>
                    <td class="op-name">{{ op[1] }}</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

</body>
</html>
